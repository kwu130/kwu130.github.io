<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">XOR Swizzling 的逻辑列到物理列映射</title>
  <desc id="desc">展示前八列中，不同行通过 physical column 等于 logical column 异或 row 进行排列。</desc>
  <defs>
    <style>
      .title { font: 700 30px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #17324d; }
      .heading { font: 700 21px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #17324d; }
      .label { font: 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334e68; }
      .mono { font: 15px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #486581; }
      .header { fill: #d9e8ef; stroke: #7293a5; stroke-width: 1.5; }
      .r0 { fill: #edf8f4; stroke: #5a9b87; stroke-width: 1.5; }
      .r1 { fill: #eef3fb; stroke: #6f8fb7; stroke-width: 1.5; }
      .r2 { fill: #fff5df; stroke: #c7963d; stroke-width: 1.5; }
      .r3 { fill: #f8ebf4; stroke: #a87698; stroke-width: 1.5; }
      .arrow { stroke: #486581; stroke-width: 2.5; fill: none; }
    </style>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#486581"/></marker>
  </defs>
  <rect width="1200" height="720" fill="#fbfcfd"/>
  <text x="600" y="48" text-anchor="middle" class="title">XOR Swizzling：行内置换，范围不变</text>
  <text x="600" y="79" text-anchor="middle" class="label">示意图只画出 32×32 tile 的前 4 行、前 8 列</text>

  <g transform="translate(55 122)">
    <rect width="460" height="485" rx="18" fill="#ffffff" stroke="#cbd5df"/>
    <text x="230" y="42" text-anchor="middle" class="heading">逻辑坐标 (row, col)</text>
    <text x="230" y="70" text-anchor="middle" class="mono">每行列顺序：0 1 2 3 4 5 6 7</text>
    <g transform="translate(46 104)">
      <rect x="0" y="0" width="70" height="44" rx="5" class="header"/><text x="35" y="28" text-anchor="middle" class="label">row</text>
      <rect x="80" y="0" width="300" height="44" rx="5" class="header"/><text x="230" y="28" text-anchor="middle" class="label">logical col</text>
      <rect x="0" y="58" width="70" height="46" rx="5" class="r0"/><text x="35" y="88" text-anchor="middle" class="label">0</text>
      <rect x="80" y="58" width="300" height="46" rx="5" class="r0"/><text x="230" y="88" text-anchor="middle" class="mono">0  1  2  3  4  5  6  7</text>
      <rect x="0" y="118" width="70" height="46" rx="5" class="r1"/><text x="35" y="148" text-anchor="middle" class="label">1</text>
      <rect x="80" y="118" width="300" height="46" rx="5" class="r1"/><text x="230" y="148" text-anchor="middle" class="mono">0  1  2  3  4  5  6  7</text>
      <rect x="0" y="178" width="70" height="46" rx="5" class="r2"/><text x="35" y="208" text-anchor="middle" class="label">2</text>
      <rect x="80" y="178" width="300" height="46" rx="5" class="r2"/><text x="230" y="208" text-anchor="middle" class="mono">0  1  2  3  4  5  6  7</text>
      <rect x="0" y="238" width="70" height="46" rx="5" class="r3"/><text x="35" y="268" text-anchor="middle" class="label">3</text>
      <rect x="80" y="238" width="300" height="46" rx="5" class="r3"/><text x="230" y="268" text-anchor="middle" class="mono">0  1  2  3  4  5  6  7</text>
    </g>
    <rect x="46" y="418" width="380" height="40" rx="8" fill="#f0f4f8"/>
    <text x="236" y="444" text-anchor="middle" class="mono">logical value 不随映射改变</text>
  </g>

  <path d="M530 365 H660" class="arrow" marker-end="url(#arrow)"/>
  <text x="595" y="322" text-anchor="middle" class="heading">映射</text>
  <text x="595" y="349" text-anchor="middle" class="mono">physical_col = col XOR row</text>

  <g transform="translate(685 122)">
    <rect width="460" height="485" rx="18" fill="#ffffff" stroke="#cbd5df"/>
    <text x="230" y="42" text-anchor="middle" class="heading">物理存储列 / Bank</text>
    <text x="230" y="70" text-anchor="middle" class="mono">每行仍是 0..7 的一个排列</text>
    <g transform="translate(46 104)">
      <rect x="0" y="0" width="70" height="44" rx="5" class="header"/><text x="35" y="28" text-anchor="middle" class="label">row</text>
      <rect x="80" y="0" width="300" height="44" rx="5" class="header"/><text x="230" y="28" text-anchor="middle" class="label">physical col</text>
      <rect x="0" y="58" width="70" height="46" rx="5" class="r0"/><text x="35" y="88" text-anchor="middle" class="label">0</text>
      <rect x="80" y="58" width="300" height="46" rx="5" class="r0"/><text x="230" y="88" text-anchor="middle" class="mono">0  1  2  3  4  5  6  7</text>
      <rect x="0" y="118" width="70" height="46" rx="5" class="r1"/><text x="35" y="148" text-anchor="middle" class="label">1</text>
      <rect x="80" y="118" width="300" height="46" rx="5" class="r1"/><text x="230" y="148" text-anchor="middle" class="mono">1  0  3  2  5  4  7  6</text>
      <rect x="0" y="178" width="70" height="46" rx="5" class="r2"/><text x="35" y="208" text-anchor="middle" class="label">2</text>
      <rect x="80" y="178" width="300" height="46" rx="5" class="r2"/><text x="230" y="208" text-anchor="middle" class="mono">2  3  0  1  6  7  4  5</text>
      <rect x="0" y="238" width="70" height="46" rx="5" class="r3"/><text x="35" y="268" text-anchor="middle" class="label">3</text>
      <rect x="80" y="238" width="300" height="46" rx="5" class="r3"/><text x="230" y="268" text-anchor="middle" class="mono">3  2  1  0  7  6  5  4</text>
    </g>
    <rect x="46" y="400" width="380" height="58" rx="8" fill="#edf8f4"/>
    <text x="236" y="425" text-anchor="middle" class="heading" fill="#206a5d">读写双方使用相同映射</text>
    <text x="236" y="448" text-anchor="middle" class="label">同一行内不会出现重复物理列</text>
  </g>

  <rect x="255" y="640" width="690" height="48" rx="10" fill="#e8f1f5"/>
  <text x="600" y="671" text-anchor="middle" class="label">完整 32×32 场景中，XOR 结果始终位于 0..31，并保持一一映射</text>
</svg>
